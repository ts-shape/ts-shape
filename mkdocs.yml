site_name: "ts-shape"
site_description: "Manufacturing time-series analytics for pandas: events, KPIs, SPC and event logs from long-format signal data."
site_url: "https://ts-shape.github.io/ts-shape"
repo_url: "https://github.com/ts-shape/ts-shape"
repo_name: "ts-shape"
site_dir: "site"
copyright: Copyright &copy; 2024-2026 Jakob Gabriel
edit_uri: edit/main/docs/

not_in_nav: |
