# mypy settings for the user-side typing tests (tests/typing/test_mypy.py):
# a strict user project that depends on ts-shape. ts-shape itself is checked
# against pyproject.toml by the CI type-check job, so its own modules are
# followed silently here.
[mypy]
python_version = 3.11
mypy_path = $MYPY_CONFIG_FILE_DIR/../../src
strict = True
enable_error_code = deprecated

[mypy-ts_shape.*]
follow_imports = silent

# Third-party packages without type information (no py.typed marker).
[mypy-pandas.*,scipy.*,sklearn.*,pyarrow.*,yaml.*,pint.*,azure.*,s3fs.*,psycopg2.*,requests.*,databricks.*,pyspark.*]
ignore_missing_imports = True
