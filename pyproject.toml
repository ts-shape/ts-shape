[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ts_shape"
dynamic = ["version"]
description = "Manufacturing time-series analytics for pandas: events, KPIs, SPC, reliability and energy from long-format signal data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Jakob Gabriel", email = "jakob.gabriel5@googlemail.com" },
]
keywords = [
    "time series",
    "manufacturing",
    "industrial",
    "OEE",
    "SPC",
    "reliability",
    "energy",
    "pandas",
    "IIoT",
    "event detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.2.0",
    "scipy>=1.13.1",
    "numpy>=2.0",
]

[project.urls]
Homepage = "https://ts-shape.github.io/ts-shape/"
Repository = "https://github.com/ts-shape/ts-shape"
"Bug Tracker" = "https://github.com/ts-shape/ts-shape/issues"

[project.optional-dependencies]
# Loader backends. The analytics core needs only pandas, numpy and scipy.
parquet = [
    "pyarrow>=15.0",
]
s3 = [
    "s3fs>=2024.10.0",
    "pyarrow>=15.0",
]
azure = [
    "azure-storage-blob>=12.19.1",
    "pyarrow>=15.0",
]
api = [
    "requests>=2.32.3",
]
sql = [
    "sqlalchemy>=2.0.32",
]
postgres = [
    "sqlalchemy>=2.0.32",
    "psycopg2-binary>=2.9.9",
]
yaml = [
    "pyyaml>=6.0",
]
# Every optional feature: all loader backends, YAML specs, units and the
# scikit-learn based detectors.
all = [
    "ts_shape[parquet,s3,azure,api,sql,postgres,yaml,ml,units]",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocs-literate-nav",
    "mkdocs-gen-files",
    "mkdocstrings[python]>=0.24",
    "black==26.3.1",
]
dev = [
    # Everything except the postgres driver, which needs a database to test.
    "ts_shape[parquet,s3,azure,api,sql,yaml,ml,units]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.100",
    "black==26.3.1",
    "ruff==0.15.8",
    "pre-commit>=3.0",
    "mypy==2.4.0",
    "build>=1.2",
    "twine>=5.0",
]
ml = [
    "scikit-learn>=1.3.0",
]
units = [
    "pint>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ts_shape = ["py.typed"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
# Used only when building outside a git checkout without a version override.
fallback_version = "0.0.0+unknown"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.coverage.run]
source = ["ts_shape"]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Fail the build if total coverage regresses below this floor. Set just under
# the current measured level; ratchet upward as coverage improves.
fail_under = 82

[tool.black]
# Kept explicit: black would infer py311-py314 from requires-python and then
# warn that its AST safety check cannot run on an older interpreter.
target-version = ["py311"]

[tool.ruff.lint]
# "UP" = pyupgrade, "I" = isort (import sorting & grouping, black-compatible).
extend-select = ["UP", "I"]

[tool.ruff.lint.isort]
known-first-party = ["ts_shape"]

[tool.mypy]
python_version = "3.11"
files = ["src/ts_shape"]
ignore_missing_imports = true
enable_error_code = ["deprecated"]
# Every module is fully annotated and checked with these flags.
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
