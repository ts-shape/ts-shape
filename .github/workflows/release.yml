name: Release Pipeline

# Every merge to main publishes a release once the full CI suite passes.
#
# The version is the latest X.Y.Z tag plus a bump. By default the bump is a
# patch. A commit since the last release can choose another one with a git
# trailer in its message (the last trailer wins):
#
#   Release-Bump: minor        # or: major, patch, none (skip this release)
#   Release-As: 0.1.0          # an exact version, higher than the last one
#
# A manual run (workflow_dispatch) takes the same choice as inputs. The tag is
# created only after the package was published, so a failed run never burns
# a version number.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: "Exact version (overrides bump), e.g. 0.1.0"
        type: string
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Full CI (lint, types, docs, tests on every supported Python, build check)
  # ===========================================================================
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # ===========================================================================
  # Decide the version
  # ===========================================================================
  version:
    name: Determine version
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      version: ${{ steps.next.outputs.version }}
      release: ${{ steps.next.outputs.release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Compute next version
        id: next
        env:
          INPUT_BUMP: ${{ github.event.inputs.bump || 'auto' }}
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
        run: python .github/scripts/next_version.py >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Build the package with the decided version
  # ===========================================================================
  build-package:
    name: Build Package
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.version }}
        run: python -m build

      - name: Verify artifacts
        env:
          EXPECTED: ${{ needs.version.outputs.version }}
        run: |
          ls -la dist/
          twine check --strict dist/*
          test -f "dist/ts_shape-${EXPECTED}.tar.gz"
          test -f "dist/ts_shape-${EXPECTED}-py3-none-any.whl"
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install -q "dist/ts_shape-${EXPECTED}-py3-none-any.whl"
          /tmp/smoke/bin/python -W error -c "import ts_shape, sys; v = ts_shape.__version__; print(v); sys.exit(v != '${EXPECTED}')"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*

  # ===========================================================================
  # Publish to PyPI, then tag and create the GitHub release
  # ===========================================================================
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [version, build-package]
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  tag-release:
    name: Tag and GitHub release
    runs-on: ubuntu-latest
    needs: [version, publish-pypi]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Create tag and release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" dist/* --title "$VERSION" --generate-notes --verify-tag

  # ===========================================================================
  # Documentation (deployed after CI, independent of publishing)
  # ===========================================================================
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install package and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[docs]"

      - name: Build MkDocs documentation
        env:
          DISABLE_MKDOCS_2_WARNING: 'true'
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: 'site'

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: build-docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
