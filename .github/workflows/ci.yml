name: CI

# Runs once per pull request commit (pull_request), from the release pipeline
# on main (workflow_call, before publishing) and on demand (workflow_dispatch).
# There is no push trigger: a push to a PR branch would otherwise run the
# same checks a second time. Open a (draft) PR to get CI on a branch, or start
# it by hand from the Actions tab.
on:
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

concurrency:
  # One run per PR (or per ref for manual and release runs); a new commit
  # cancels the run for the previous one.
  group: "ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # Tool versions come from the [dev] extra; installing the package also
      # gives mypy the pandas, numpy and scipy types.
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting (black)
        run: black --check src tests examples scripts

      - name: Lint (ruff)
        run: ruff check src tests examples scripts

      - name: Type check (mypy)
        run: mypy

  docs:
    name: Docs (strict build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install package and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[docs]"

      - name: Build MkDocs documentation (warnings are errors)
        env:
          DISABLE_MKDOCS_2_WARNING: 'true'
        run: mkdocs build --strict

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        env:
          PYTHONDEVMODE: "1"
        run: pytest --cov=ts_shape --cov-report=xml --cov-report=term

      # Timing and memory checks at 200k/400k rows (tests/test_scale.py, a few
      # seconds). Left out of the run above, where coverage and dev mode skew
      # timings; one Python version is enough.
      - name: Run scale checks
        if: matrix.python-version == '3.13'
        run: pytest -m scale -q tests/test_scale.py

      - name: Upload coverage report
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  min-deps:
    name: Test (minimum dependency versions)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # Pin every core dependency to the floor declared in pyproject.toml
      # ("pandas>=2.2.2" -> "pandas==2.2.2"), so the floors stay tested when
      # they change. The optional extras resolve against those pins.
      - name: Pin core dependencies to their declared minimums
        shell: python
        run: |
          import re, tomllib
          with open("pyproject.toml", "rb") as f:
              deps = tomllib.load(f)["project"]["dependencies"]
          pins = []
          for dep in deps:
              m = re.fullmatch(r"([A-Za-z0-9_.-]+)\s*>=\s*([0-9][0-9.]*)", dep)
              if m is None:
                  raise SystemExit(f"cannot derive a minimum from {dep!r}")
              pins.append(f"{m[1]}=={m[2]}\n")
          with open("min-constraints.txt", "w") as f:
              f.writelines(pins)
          print("".join(pins), end="")

      - name: Install package with minimum dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c min-constraints.txt ".[dev]"
          pip check
          pip list | grep -iE '^(pandas|numpy|scipy) '

      - name: Run tests
        run: pytest -q

  build:
    name: Build & check package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build

      - name: Check metadata and version
        run: |
          ls -la dist/
          twine check --strict dist/*
          # setuptools-scm must derive the version from the tags, never 0.0.0.
          if ls dist/ | grep -F -q -- "-0.0.0"; then
            echo "::error::package built as version 0.0.0 (setuptools-scm config not read)"
            exit 1
          fi

      - name: Install the wheel and import it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install -q dist/*.whl
          /tmp/smoke/bin/python -W error -c "import ts_shape; print(ts_shape.__version__); from ts_shape import *"

  scan:
    name: Deprecation & vulnerability scan
    runs-on: ubuntu-latest
    # Informational for now; the script itself always exits 0.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install package, dev extras, and scan tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit

      - name: Run the scan
        run: scripts/scan_deprecations.sh scan-results

      - name: Upload scan artefacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deprecation-scan
          path: scan-results/
          retention-days: 14
